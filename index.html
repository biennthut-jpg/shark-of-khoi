<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đại Dương Cá Mập Của Bé</title>
<style>
:root{--navy:#052b45;--blue:#087ca7;--cyan:#6ee7f2;--sand:#fff5d6;--gold:#ffd166;--card:#ffffff;--text:#123;--muted:#547080;--ok:#18a76f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(#79dcf4 0,#d8f7ff 38%,#fdf7df 100%);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#063952,#087ca7);color:white;padding:18px 16px 28px;position:relative;overflow:hidden}.top:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-18px;height:35px;background:radial-gradient(50px 18px at 50px 0,#e6fbff 98%,transparent 100%);background-size:84px 35px}.hero{max-width:1120px;margin:auto;display:flex;align-items:center;gap:16px}.logo{font-size:48px}.hero h1{font-size:clamp(25px,5vw,44px);margin:0}.hero p{margin:5px 0 0;color:#d8f8ff}.wrap{max-width:1120px;margin:auto;padding:20px 14px 50px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;background:#ffffffdd;padding:12px;border-radius:18px;box-shadow:0 10px 30px #00527320;position:sticky;top:8px;z-index:5}.toolbar input,.toolbar select{border:2px solid #a8dce9;border-radius:13px;padding:11px;min-width:0}.toolbar button{border:0;border-radius:13px;padding:11px 14px;background:var(--gold);font-weight:800}.progress{margin:14px 2px;background:white;border-radius:14px;padding:10px 13px;display:flex;gap:12px;align-items:center}.bar{height:12px;flex:1;background:#dcecf1;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16b777,#ffd166);transition:.3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 25px #00425c22;border:3px solid transparent;transition:.2s;position:relative}.card:hover{transform:translateY(-4px);border-color:#73d8ea}.card.learned{border-color:#40c98a}.pic{height:155px;background:linear-gradient(#44b6da,#0a628d);display:grid;place-items:center;position:relative;overflow:hidden}.pic:after{content:"";position:absolute;inset:auto 0 0;height:30px;background:radial-gradient(circle at 15px 26px,#f5d786 12px,transparent 13px);background-size:34px 30px;opacity:.75}.shark-svg{width:90%;height:135px;filter:drop-shadow(0 8px 5px #00304755)}.badge{position:absolute;top:9px;right:9px;background:#fff4;border:1px solid #fff8;color:white;border-radius:20px;padding:5px 9px;font-weight:800;font-size:12px;backdrop-filter:blur(4px)}.content{padding:14px}.name{margin:0;color:#074d70;font-size:20px}.en{color:var(--muted);font-size:12px;font-style:italic}.fact{margin:10px 0;line-height:1.45;min-height:64px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;background:#e8f8fc;border-radius:20px;padding:5px 8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:11px;padding:9px 10px;font-weight:800;flex:1}.detail{background:#087ca7;color:white}.speak{background:#ffe391;color:#5d4200}.star{position:absolute;left:9px;top:9px;background:white;border-radius:50%;width:34px;height:34px;border:0;font-size:18px}.modal{position:fixed;inset:0;background:#00283bbb;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.panel{background:white;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 25px 70px #001f31}.panel-head{height:245px;background:linear-gradient(#45bfe2,#07577e);display:grid;place-items:center;position:relative}.close{position:absolute;right:12px;top:12px;border:0;border-radius:50%;width:42px;height:42px;font-size:24px;background:white}.panel-body{padding:20px}.big-title{font-size:30px;color:#07577e;margin:0}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.info div{background:#edf9fc;padding:12px;border-radius:14px}.secret{background:#fff2b8;border:2px dashed #e0a900;padding:14px;border-radius:15px;font-size:18px}.quiz{margin-top:22px;background:#eefaf2;padding:15px;border-radius:16px}.answers{display:grid;gap:8px;margin-top:10px}.answers button{padding:11px;border:2px solid #94d9b5;background:white;border-radius:12px;text-align:left}.answers button.good{background:#bdf2d4;border-color:#18a76f}.answers button.bad{background:#ffd6d6;border-color:#e45b5b}.quiz-note{min-height:24px;font-weight:800;margin-top:7px}.footer{text-align:center;color:#426976;margin-top:25px}.empty{text-align:center;background:white;padding:30px;border-radius:18px;display:none}
@media(max-width:620px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.hero{align-items:flex-start}.logo{font-size:38px}.info{grid-template-columns:1fr}.panel-head{height:190px}.big-title{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="hero"><div class="logo">🦈</div><div><h1>Đại Dương Cá Mập Của Bé</h1><p>Khám phá 20 người bạn kỳ lạ dưới biển, nghe kể chuyện và nhận sao!</p></div></div></header>
<main class="wrap">
<section class="toolbar" aria-label="Công cụ tìm kiếm"><input id="search" aria-label="Tìm cá mập" placeholder="🔎 Tìm theo tên, nơi sống, thức ăn..."><select id="habitat" aria-label="Lọc nơi sống"><option value="">🌍 Mọi nơi sống</option><option>Biển khơi</option><option>Rạn san hô</option><option>Biển sâu</option><option>Biển lạnh</option><option>Ven bờ</option></select><button id="random" type="button">🎲 Khám phá</button></section>
<section class="progress"><b>⭐ Bộ sưu tập: <span id="count">0</span>/20</b><div class="bar"><i id="bar"></i></div><span id="rank">Nhà thám hiểm nhí</span></section>
<div id="grid" class="grid"></div><div id="empty" class="empty">🐟 Chưa tìm thấy. Bé thử từ khóa khác nhé!</div>
<p class="footer">Nội dung mang tính giáo dục, kích thước là giá trị gần đúng. Hãy yêu quý và bảo vệ đại dương 💙</p>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><article class="panel"><div class="panel-head"><button class="close" id="close" aria-label="Đóng">×</button><div id="modalImage"></div></div><div class="panel-body" id="modalBody"></div></article></div>
<script>
const sharks=[

{name:'Cá mập hổ',en:'Tiger Shark',size:'4–5,5 m',habitat:'Ven bờ',food:'Cá, rùa và nhiều món khác',style:'Đi săn ban đêm',color:'#77867c',stripes:true,desc:'Cá non có các sọc sẫm giống như một chú hổ.',secret:'Các sọc trên cơ thể thường mờ dần khi tớ lớn lên.',q:'Tên cá mập hổ đến từ đặc điểm nào?',a:['Có sọc như hổ','Biết gầm','Sống trong rừng'],ok:0},

{name:'Cá mập y tá',en:'Nurse Shark',size:'2–3 m',habitat:'Rạn san hô',food:'Cua, mực, cá nhỏ',style:'Hay nghỉ dưới đáy',color:'#9c805f',desc:'Thường nằm nghỉ gần đáy biển rồi kiếm ăn khi trời tối.',secret:'Tớ có thể dùng miệng hút thức ăn từ các khe đá.',q:'Cá mập y tá thường nghỉ ở đâu?',a:['Dưới đáy biển','Trên mây','Trong tổ chim'],ok:0},

{name:'Cá mập vây trắng đại dương',en:'Oceanic Whitetip',size:'2,5–3 m',habitat:'Biển khơi',food:'Cá, mực',style:'Kiên trì khám phá',color:'#8f9b9c',whitetip:true,desc:'Sống xa bờ trong vùng biển ấm, có vây dài với chóp trắng.',secret:'Đôi vây ngực dài giúp tớ lướt tiết kiệm sức.',q:'Loài này thường sống ở đâu?',a:['Xa bờ','Trong ao nhỏ','Trên băng'],ok:0},
{name:'Cá mập đuôi dài',en:'Thresher Shark',size:'4–6 m kể cả đuôi',habitat:'Biển khơi',food:'Cá nhỏ',style:'Dùng đuôi săn mồi',color:'#657d91',longtail:true,desc:'Phần đuôi trên rất dài, có thể dùng để làm choáng đàn cá.',secret:'Gần một nửa chiều dài cơ thể tớ có thể là chiếc đuôi.',q:'Bộ phận đặc biệt nhất là gì?',a:['Chiếc đuôi dài','Đôi tai','Bốn chân'],ok:0},
{name:'Cá mập yêu tinh',en:'Goblin Shark',size:'3–4 m',habitat:'Biển sâu',food:'Cá nhỏ, mực, giáp xác',style:'Chậm và bí ẩn',color:'#d9a4a8',goblin:true,desc:'Có mõm dài và bộ hàm có thể phóng nhanh ra phía trước.',secret:'Màu hồng nhạt là do mạch máu hiện qua lớp da mỏng.',q:'Hàm cá mập yêu tinh có thể làm gì?',a:['Phóng ra phía trước','Hát','Thổi bong bóng'],ok:0},
{name:'Cá mập miệng rộng',en:'Megamouth Shark',size:'4–5,5 m',habitat:'Biển sâu',food:'Sinh vật phù du',style:'Hiếm gặp',color:'#4b5960',bigmouth:true,desc:'Có cái miệng rất lớn nhưng chủ yếu ăn sinh vật nhỏ.',secret:'Tớ là loài hiếm đến mức con người chỉ thỉnh thoảng mới gặp.',q:'Dù có miệng rộng, loài này ăn gì?',a:['Sinh vật nhỏ','Tàu biển','Đá'],ok:0},
{name:'Cá nhám phơi nắng',en:'Basking Shark',size:'8–12 m',habitat:'Biển khơi',food:'Sinh vật phù du',style:'Hiền và lọc nước',color:'#777b77',bigmouth:true,desc:'Loài cá lớn thứ hai, thường bơi với miệng mở để lọc thức ăn.',secret:'Tên gọi khiến nhiều người tưởng tớ đang phơi nắng khi bơi gần mặt biển.',q:'Cá nhám phơi nắng kiếm ăn bằng cách nào?',a:['Lọc nước','Leo cây','Đào hang'],ok:0},
{name:'Cá mập Greenland',en:'Greenland Shark',size:'5–6 m',habitat:'Biển lạnh',food:'Cá và xác động vật',style:'Bơi rất chậm',color:'#5f7775',desc:'Sống trong vùng nước lạnh, tối và nổi tiếng vì tuổi thọ dài.',secret:'Tớ phát triển rất chậm và là một trong những động vật có xương sống sống lâu nhất.',q:'Cá mập Greenland thích vùng nước nào?',a:['Lạnh','Nước sôi','Ao cạn'],ok:0},
{name:'Cá mập đèn lồng lùn',en:'Dwarf Lantern Shark',size:'18–20 cm',habitat:'Biển sâu',food:'Sinh vật biển nhỏ',style:'Nhỏ và phát sáng',color:'#273b55',glow:true,desc:'Một trong những cá mập nhỏ nhất, có thể vừa trong bàn tay người lớn.',secret:'Cơ quan phát sáng giúp tớ ngụy trang trong vùng nước tối.',q:'Điểm đặc biệt của loài này là gì?',a:['Có thể phát sáng','Có cánh','Có lông'],ok:0},
{name:'Cá mập cắt bánh quy',en:'Cookie-cutter Shark',size:'40–55 cm',habitat:'Biển sâu',food:'Cắn một miếng trên con mồi lớn',style:'Nhỏ nhưng lạ',color:'#4b3f42',desc:'Để lại vết cắn tròn giống như khuôn cắt bánh quy.',secret:'Tớ dùng môi hút bám rồi xoay người để tạo vết cắn tròn.',q:'Vết cắn của loài này có hình giống gì?',a:['Miếng bánh tròn','Ngôi sao','Tam giác'],ok:0},

{name:'Cá mập cưa Nhật Bản',en:'Japanese Sawshark',size:'1–1,5 m',habitat:'Biển sâu',food:'Cá nhỏ, giáp xác',style:'Dùng mõm tìm mồi',color:'#8b8f86',saw:true,desc:'Mõm dài có các răng nhỏ hai bên, trông giống chiếc cưa.',secret:'Mõm cưa có thể cảm nhận và quét qua nền đáy để tìm thức ăn.',q:'Mõm của loài này giống dụng cụ gì?',a:['Chiếc cưa','Cây bút','Chiếc cốc'],ok:0},
{name:'Cá mập ngựa vằn',en:'Zebra Shark',size:'2–2,5 m',habitat:'Rạn san hô',food:'Ốc, cua, cá nhỏ',style:'Hiền, hoạt động ban đêm',color:'#d5b56e',spots:true,desc:'Khi nhỏ có sọc, khi lớn lại có nhiều đốm trên cơ thể.',secret:'Tên gọi đến từ hình dáng lúc còn nhỏ, không phải lúc trưởng thành.',q:'Khi lớn, cá mập ngựa vằn thường có gì?',a:['Nhiều đốm','Bộ lông','Sừng dài'],ok:0}

const $=s=>document.querySelector(s), grid=$('#grid');let active=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sharkSVG(s,big=false){let tail=s.longtail?15:37, body=s.flat?'M35 70 Q90 30 155 58 Q195 38 225 55 L270 32 L258 66 L277 94 L226 76 Q190 94 150 80 Q85 108 35 70':'M35 68 Q90 25 178 54 Q215 41 242 53 L278 '+tail+' L257 66 L279 96 L241 77 Q205 91 174 78 Q92 112 35 68';let head=s.hammer?'<path d="M40 49 Q25 55 18 70 Q25 85 40 90 L57 78 L57 58Z" fill="'+s.color+'"/>':'';let snout=s.saw?'<path d="M42 63 L2 69 L42 76 M10 67l-5-8m14 7l-4-9m15 8l-3-8" stroke="#d7d2b7" stroke-width="4" fill="none"/>':'';let pattern=s.spots?'<g fill="#d4edf4" opacity=".8">'+[80,108,136,165,195].map((x,i)=>`<circle cx="${x}" cy="${55+(i%2)*18}" r="${3+i%3}"/>`).join('')+'</g>':'';if(s.stripes)pattern='<g stroke="#25373b" stroke-width="7" opacity=".55"><path d="M90 43l10 48M120 36l10 50M153 38l8 47"/></g>';let mouth=s.bigmouth?'<ellipse cx="54" cy="72" rx="19" ry="13" fill="#17232a"/>':'<path d="M42 76 Q58 83 72 75" stroke="#26383d" stroke-width="3" fill="none"/>';let glow=s.glow?'filter:drop-shadow(0 0 10px #8ffcff)': '';return `<svg class="shark-svg" style="${glow}" viewBox="0 0 290 130" role="img" aria-label="Hình minh họa ${esc(s.name)}"><path d="${body}" fill="${s.color}" stroke="#395760" stroke-width="2"/>${head}${snout}<path d="M117 48 L145 12 L155 52" fill="${s.color}" stroke="#395760" stroke-width="2"/><path d="M105 80 L132 110 L152 78" fill="${s.color}" stroke="#395760" stroke-width="2"/>${pattern}<circle cx="52" cy="60" r="4" fill="#061820"/>${mouth}${s.blacktip?'<path d="M138 22l7-10 10 40" fill="#111"/>':''}${s.whitetip?'<circle cx="148" cy="18" r="5" fill="#fff"/>':''}${s.goblin?'<path d="M43 55L7 68l36 2" fill="#d9a4a8" stroke="#6c5558"/>':''}</svg>`}
function card(s,i){return `<article class="card ${isLearned(i)?'learned':''}" data-habitat="${s.habitat}" data-text="${(s.name+' '+s.en+' '+s.habitat+' '+s.food).toLowerCase()}"><div class="pic">${sharkSVG(s)}<span class="badge">${s.habitat}</span><button class="star" type="button" aria-label="Đánh dấu đã học" data-star="${i}">${isLearned(i)?'⭐':'☆'}</button></div><div class="content"><h2 class="name">${s.name}</h2><div class="en">${s.en}</div><p class="fact">${s.desc}</p><div class="chips"><span class="chip">📏 ${s.size}</span><span class="chip">🍽️ ${s.food}</span></div><div class="actions"><button class="detail" data-open="${i}" type="button">Khám phá</button><button class="speak" data-speak="${i}" type="button">🔊 Nghe</button></div></div></article>`}
function getLearned(){try{return JSON.parse(localStorage.getItem('shark-learned')||'[]')}catch{return []}}function isLearned(i){return getLearned().includes(i)}
function toggleLearned(i){let a=getLearned();a=a.includes(i)?a.filter(x=>x!==i):[...a,i];localStorage.setItem('shark-learned',JSON.stringify(a));render();updateProgress()}
function updateProgress(){let n=getLearned().length;$('#count').textContent=n;$('#bar').style.width=(n/20*100)+'%';$('#rank').textContent=n===20?'🏆 Bậc thầy cá mập':n>=10?'🌟 Chuyên gia cá mập':n>=5?'🐚 Nhà thám hiểm biển':'Nhà thám hiểm nhí'}
function render(){let q=$('#search').value.trim().toLowerCase(),h=$('#habitat').value;let out=sharks.map((s,i)=>({s,i})).filter(x=>(!q||(x.s.name+' '+x.s.en+' '+x.s.habitat+' '+x.s.food+' '+x.s.desc).toLowerCase().includes(q))&&(!h||x.s.habitat===h));grid.innerHTML=out.map(x=>card(x.s,x.i)).join('');$('#empty').style.display=out.length?'none':'block'}
function speak(i){speechSynthesis.cancel();let s=sharks[i];let u=new SpeechSynthesisUtterance(`${s.name}. ${s.desc} Kích thước khoảng ${s.size}. Sống ở ${s.habitat}. Thức ăn: ${s.food}. Bí mật thú vị: ${s.secret}`);u.lang='vi-VN';u.rate=.86;speechSynthesis.speak(u)}
function openModal(i){active=i;let s=sharks[i];$('#modalImage').innerHTML=sharkSVG(s,true);$('#modalBody').innerHTML=`<h2 class="big-title" id="modalTitle">${s.name}</h2><div class="en">${s.en}</div><div class="info"><div>📏 <b>Kích thước</b><br>${s.size}</div><div>🌍 <b>Nơi sống</b><br>${s.habitat}</div><div>🍽️ <b>Thức ăn</b><br>${s.food}</div><div>🏊 <b>Tập tính</b><br>${s.style}</div></div><div class="secret">💡 <b>Bí mật thú vị:</b> ${s.secret}</div><div class="actions"><button class="speak" id="modalSpeak" type="button">🔊 Nghe kể chuyện</button><button class="detail" id="learnNow" type="button">${isLearned(i)?'✅ Đã học':'⭐ Con đã học xong'}</button></div><section class="quiz"><b>🎮 Câu hỏi nhỏ</b><div>${s.q}</div><div class="answers">${s.a.map((a,j)=>`<button type="button" data-answer="${j}">${a}</button>`).join('')}</div><div class="quiz-note" aria-live="polite"></div></section>`;$('#modal').classList.add('show');$('#modalSpeak').onclick=()=>speak(i);$('#learnNow').onclick=()=>{if(!isLearned(i))toggleLearned(i);$('#learnNow').textContent='✅ Đã học'};$('#modal').querySelector('.answers').onclick=e=>{let b=e.target.closest('[data-answer]');if(!b)return;let good=+b.dataset.answer===s.ok;b.classList.add(good?'good':'bad');$('.quiz-note').textContent=good?'🎉 Chính xác! Bé giỏi quá!':'🙂 Chưa đúng, bé thử lại nhé!'} }
$('#grid').addEventListener('click',e=>{let t=e.target.closest('[data-open],[data-speak],[data-star]');if(!t)return;if(t.dataset.open!==undefined)openModal(+t.dataset.open);if(t.dataset.speak!==undefined)speak(+t.dataset.speak);if(t.dataset.star!==undefined)toggleLearned(+t.dataset.star)});$('#search').addEventListener('input',render);$('#habitat').addEventListener('change',render);$('#random').onclick=()=>openModal(Math.floor(Math.random()*sharks.length));$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});render();updateProgress();
</script>
</body></html>
